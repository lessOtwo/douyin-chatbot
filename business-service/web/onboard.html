<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商家入驻 · 抖音客服</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#1a2a45;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:900px;margin:42px auto;padding:0 18px}h1{font-size:27px;margin:0 0 9px}h2{font-size:19px;margin:0 0 10px}.muted{color:#71809a}.card{background:white;border:1px solid #e2e8f1;border-radius:13px;padding:28px;margin:20px 0;box-shadow:0 8px 30px #15213e08}label{display:block;margin:13px 0 5px;color:#60708b}input,select,textarea{width:100%;padding:10px;border:1px solid #d8e1ee;border-radius:8px;font:inherit;color:#1a2a45;background:white}textarea{min-height:75px}button{background:#3158d7;color:white;border:0;border-radius:8px;padding:11px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.projects{border:1px solid #e2e8f1;border-radius:8px;overflow:hidden}.project{display:grid;grid-template-columns:minmax(120px,1fr) repeat(4,90px);align-items:center;border-bottom:1px solid #e2e8f1;padding:10px;gap:4px}.project:last-child{border:0}.project.header{background:#f5f8fe;color:#60708b;font-size:13px}.project label{margin:0;text-align:center}.project input{width:auto;accent-color:#3158d7}.preview{background:#f5f8fe;padding:18px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.errors{background:#fff5ee;color:#924a24;padding:14px 18px;border-radius:8px}#submit{display:none}#status{margin:15px 0}ul{padding-left:22px}@media(max-width:650px){main{margin:20px auto}.card{padding:18px}.grid{grid-template-columns:1fr}.project{grid-template-columns:minmax(70px,1fr) repeat(4,55px);font-size:12px;padding:8px 4px}}
</style></head><body><main><h1>商家入驻</h1><p class="muted">请使用平台发给您的有效邀请链接填写资料。提交后由平台审核，审核前不会用于客服回答。</p>
<section class="card" id="formCard">
<div id="returnReason" class="errors" style="display:none"></div>
<h2>经营项目</h2><label for="industry">所属行业</label><select id="industry" required><option value="">请选择行业</option></select><p class="muted">每个项目只选一种经营状态；主做、其他可做和不做都可以选多项。至少选择一项主做项目。</p><div id="projects" class="projects"><div class="muted" style="padding:15px">请先选择行业</div></div>
<h2 style="margin-top:28px">门店资料</h2><div class="grid">
<div><label for="douyinAccount">门店抖音号（纯数字，非昵称）*</label><input id="douyinAccount" inputmode="numeric" pattern="[0-9]+" maxlength="500" required></div>
<div><label for="douyinNickname">抖音昵称 *</label><input id="douyinNickname" maxlength="500" required placeholder="例如：东营大美聊装修"></div>
<div><label for="storeName">完整门店名称 *</label><input id="storeName" maxlength="500" required></div>
<div><label for="serviceArea">服务城市／覆盖区域 *</label><input id="serviceArea" maxlength="500" required placeholder="可填写省、市或区"></div>
<div><label for="businessHours">门店营业时间</label><input id="businessHours" maxlength="500"></div>
<div><label for="address">门店详细地址</label><input id="address" maxlength="500"></div>
<div><label for="storePhone">门店联系电话</label><input id="storePhone" maxlength="500"></div>
</div><label style="display:flex;align-items:center;gap:8px"><input id="storePhonePublic" type="checkbox" style="width:auto">允许在客服回复中公开门店电话</label>
<label for="materials">可提供的资料或服务 *</label><textarea id="materials" maxlength="500" required placeholder="例如发清单、预约门店沟通；请填写确实可提供的内容"></textarea>
<h2 style="margin-top:28px">入驻联系人</h2><div class="grid"><div><label for="contactName">联系人姓名 *</label><input id="contactName" maxlength="80" autocomplete="name" required></div><div><label for="contactPhone">联系人电话 *</label><input id="contactPhone" maxlength="30" autocomplete="tel" required></div></div>
<div class="row" style="margin-top:22px"><button id="preview" type="button">预览并检查</button><button id="submit" type="button" disabled>确认提交审核</button></div><div id="status" role="status"></div><div id="result"></div>
</section></main><script>
const token=new URLSearchParams(location.search).get('token')||'',status=document.querySelector('#status'),result=document.querySelector('#result');let catalog={industries:[],projects:[]},validated=null;
const $=s=>document.querySelector(s),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const siteBase=new URL('.',location.href);
function sitePath(path){return new URL(path.replace(/^\//,''),siteBase).toString()}
async function call(path,body){const response=await fetch(sitePath(path),{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const value=await response.json();if(!response.ok)throw Error(value.error||'请求失败');return value}
function displayError(v){const s=String(v??'');if(s==='internal operation failed')return '提交失败，请稍后重试';return /[A-Za-z]{3,}/.test(s)&&!/[\u4e00-\u9fff]/.test(s)?'提交失败，请联系平台核对':s}
function invalidate(){validated=null;$('#submit').disabled=true;$('#submit').style.display='none';result.innerHTML=''}
function renderProjects(){invalidate();const list=catalog.projects.filter(p=>p.industry_id===$('#industry').value);$('#projects').innerHTML=list.length?'<div class="project header"><span>项目</span><span>主做</span><span>其他可做</span><span>不做</span><span>未选择</span></div>'+list.map(p=>'<div class="project"><span>'+safe(p.name)+'</span>'+[['main','主做'],['available','其他可做'],['excluded','不做'],['none','未选择']].map(([kind,label])=>'<label title="'+label+'"><input type="radio" name="project-'+safe(p.id)+'" value="'+kind+'" data-project="'+safe(p.id)+'" '+(kind==='none'?'checked':'')+' aria-label="'+safe(p.name)+'：'+label+'"></label>').join('')+'</div>').join(''):'<div class="muted" style="padding:15px">该行业暂无已发布项目，请联系平台配置。</div>'}
function payload(){const choices={main:[],available:[],excluded:[]};document.querySelectorAll('#projects input:checked').forEach(item=>{if(choices[item.value])choices[item.value].push(item.dataset.project)});return {token,industry_id:$('#industry').value,main_project_ids:choices.main,available_project_ids:choices.available,excluded_project_ids:choices.excluded,fields:{douyin_account:$('#douyinAccount').value,douyin_nickname:$('#douyinNickname').value,store_name:$('#storeName').value,service_area:$('#serviceArea').value,business_hours:$('#businessHours').value,address:$('#address').value,store_phone:$('#storePhone').value,store_phone_public:$('#storePhonePublic').checked,materials_or_services:$('#materials').value},contact_name:$('#contactName').value,contact_phone:$('#contactPhone').value}}
async function init(){try{if(!token)throw Error('邀请链接缺少令牌');catalog=await call('/api/onboard/context?token='+encodeURIComponent(token));$('#industry').innerHTML='<option value="">请选择行业</option>'+catalog.industries.map(i=>'<option value="'+safe(i.id)+'">'+safe(i.name)+'</option>').join('');if(!catalog.industries.length)status.textContent='暂无已发布行业，请联系平台';const previous=catalog.prefill;if(previous?.profile){const profile=previous.profile,fields=profile.fields||{};$('#returnReason').style.display='block';$('#returnReason').textContent='退回原因：'+(previous.review_reason||'请核对并修改资料后重新提交');$('#industry').value=profile.industry_id||'';renderProjects();for(const [kind,items] of Object.entries(profile.projects||{})){for(const item of items||[]){const radio=[...document.querySelectorAll('#projects input')].find(input=>input.dataset.project===item.id&&input.value===kind);if(radio)radio.checked=true}}const values={douyinAccount:'门店抖音号',douyinNickname:'抖音昵称',storeName:'完整门店名称',serviceArea:'服务区域',businessHours:'门店营业时间',address:'门店详细地址',storePhone:'门店联系电话',materials:'资料或服务'};for(const [element,label] of Object.entries(values))$('#'+element).value=fields[label]||'';$('#storePhonePublic').checked=fields['门店电话可公开']==='是';$('#contactName').value=previous.contact_name||'';$('#contactPhone').value=previous.contact_phone||'';status.textContent='原资料已带入，请按退回原因修改，预览后重新提交。'}}catch(error){status.textContent=displayError(error.message);$('#preview').disabled=true}}
$('#industry').onchange=renderProjects;$('#formCard').addEventListener('input',invalidate);$('#formCard').addEventListener('change',e=>{if(e.target.id!=='industry')invalidate()});
$('#preview').onclick=async()=>{const button=$('#preview');button.disabled=true;try{const input=payload();const response=await call('/api/onboard/preview',input);validated=input;const p=response.profile;const labels={main:'主做项目',available:'其他可做项目',excluded:'不做项目'};result.innerHTML='<h2>提交前核对</h2><div class="preview">'+Object.entries(p.fields).map(([k,v])=>safe(k)+'：'+safe(v)).join('\n')+'\n'+Object.entries(labels).map(([k,v])=>v+'：'+(p.projects[k].map(x=>x.name).join('、')||'无')).join('\n')+'</div>';status.textContent='检查通过，请核对信息后提交';$('#submit').disabled=false;$('#submit').style.display='inline-block'}catch(error){status.textContent=displayError(error.message)}finally{button.disabled=false}};
$('#submit').onclick=async()=>{const button=$('#submit');button.disabled=true;try{if(!validated)throw Error('请先预览并检查');const response=await call('/api/onboard/submit',validated);status.textContent='提交成功，等待平台审核。请保存商家编号：'+response.merchant_id;$('#formCard').querySelectorAll('input,select,textarea,button').forEach(element=>element.disabled=true);result.innerHTML=''}catch(error){status.textContent=displayError(error.message);button.disabled=false}};
init();
</script></body></html>
